<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Mini Screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{
  --bg:#050505; --fg:#f2f2f2; --dim:#8a8a8a;
  --pink:#ff3fa4; --cyan:#27d6ff; --yellow:#ffd23f; --green:#6dff5a; --orange:#ff7a3d; --red:#ff3b3b; --purple:#b48cff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'VT323',ui-monospace,monospace;font-size:20px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:8px;gap:8px}
#screens{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;gap:8px}
.screen.on{display:grid}
.panel{position:relative;border:3px solid var(--c,var(--cyan));padding:14px 10px 8px;min-height:0;overflow:hidden}
.tag{position:absolute;top:-1px;left:-1px;background:var(--c,var(--cyan));color:#000;font:700 11px 'Silkscreen',monospace;padding:1px 6px;letter-spacing:1px}
.tag.r{left:auto;right:-1px}
.pk{--c:var(--pink)} .cy{--c:var(--cyan)} .yl{--c:var(--yellow)} .gr{--c:var(--green)} .or{--c:var(--orange)} .rd{--c:var(--red)} .pu{--c:var(--purple)}
button{font:700 14px 'Silkscreen',monospace;background:#000;color:var(--c,var(--fg));border:2px solid var(--c,var(--fg));padding:6px 8px;cursor:pointer}
button:active,button.hold{background:var(--c,var(--fg));color:#000}

/* tabs */
#tabs{display:flex;gap:6px}
#tabs button{flex:1;padding:4px;font-size:12px;border-width:2px;color:var(--dim);border-color:#333}
#tabs button.on{color:#000;background:var(--cyan);border-color:var(--cyan)}

/* music */
#s-music{grid-template-columns:34% 1fr;grid-template-rows:1.7fr 1fr}   /* lyrics get the bigger share */
#m-card{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
#art{width:46%;max-width:150px;aspect-ratio:1;background:#111 center/cover;border:2px solid #333;flex:none}
#m-title{font-size:26px;line-height:1;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:bold}
#m-artist{color:var(--dim);font-size:20px;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#m-bar{font-size:16px;letter-spacing:0;color:var(--fg);white-space:nowrap;overflow:hidden}
#m-time{font-size:16px;color:var(--dim)}
#m-ctl{display:flex;gap:8px;margin-top:auto}
#m-ctl button{font-size:18px;width:52px;height:40px}
#m-play{--c:var(--yellow)}
#lyrics{grid-column:2;grid-row:1;padding:0}
/* animated lyrics: smooth scroll, the current line grows and lights up, its words fill in as they are sung */
#ly-wrap{position:absolute;left:14px;right:14px;top:26px;bottom:6px;overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent 0,#000 16%,#000 80%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 16%,#000 80%,transparent 100%)}
#ly-list{position:absolute;left:0;right:0;top:0;transition:transform .6s cubic-bezier(.3,.8,.3,1);will-change:transform}
.ln{width:86%;padding:5px 0;font-size:var(--lyfs,24px);line-height:1.12;font-weight:bold;opacity:.36;transform:scale(.82);transform-origin:left center;
  transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .5s}
.ln.d1{opacity:.55}
.ln.cur{opacity:1;transform:scale(1.12)}
.ln .w{background:linear-gradient(90deg,#fff var(--f,100%),rgba(255,255,255,.38) var(--f,100%));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ln.ph{width:100%;text-align:center;font-weight:normal;opacity:.6;transform:none;color:var(--dim)}
#ly-off{position:absolute;right:104px;top:3px;display:flex;align-items:center;gap:6px;font:700 11px 'Silkscreen',monospace;color:var(--dim)}
#ly-off button{padding:0 10px;font-size:14px;line-height:1.1;border-width:2px;--c:var(--dim);touch-action:none}
#ly-v{cursor:pointer;min-width:64px;text-align:center}
#viz{grid-column:2;grid-row:2;padding:0}
#viz canvas{width:100%;height:100%;display:block}

/* home */
#s-home{grid-template-columns:1.2fr 1fr;grid-template-rows:1fr auto}
#clock{grid-row:1;display:flex;flex-direction:column;justify-content:center;align-items:center}
#clock-t{font-size:clamp(70px,calc(var(--sh,100vh)*.22),150px);line-height:.9;font-weight:bold;letter-spacing:2px}
#clock-d{font-size:22px;color:var(--dim)}
#clock-loc{font:700 11px 'Silkscreen',monospace;color:var(--cyan);letter-spacing:1px;margin-top:4px;max-width:100%;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-transform:uppercase}
#clock-loc:not(:empty)::before{content:'\25CF  '}
#pray-next{color:var(--yellow);font-size:22px;margin-top:6px}
#stats{grid-row:1;grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;align-content:center}
.stat .l{font-size:16px;color:var(--dim)} .stat .v{font-size:28px;line-height:1}
.stat .b{height:8px;background:#222;margin-top:2px}.stat .b i{display:block;height:100%;background:var(--c,var(--cyan));width:0}
#prayer{grid-column:1/3;grid-row:2;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
#prayer div{border:2px solid #333;padding:2px;font-size:18px}
#prayer div b{display:block;font:700 10px 'Silkscreen',monospace;color:var(--dim)}
#prayer div.nx{border-color:var(--yellow);color:var(--yellow)}
#prayer div.nx b{color:var(--yellow)}

/* control */
#s-ctrl{grid-template-columns:1fr;grid-template-rows:1.1fr 1fr}
/* up next (Apple Music queue) */
#s-queue{grid-template-columns:1fr;grid-template-rows:1fr}
#q-now{position:absolute;left:10px;right:10px;top:28px;height:62px;display:flex;align-items:center;gap:10px;padding:5px 10px;border:2px solid var(--green);background:rgba(109,255,90,.10)}
#q-art{width:48px;height:48px;flex:none;background:#111 center/cover;border:1px solid #333}
#q-now .m{flex:1;min-width:0}
#q-now .lab{display:flex;align-items:center;gap:6px;font:700 10px 'Silkscreen',monospace;color:var(--green);letter-spacing:1px}
#q-now .t{font-size:22px;font-weight:bold;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#q-now .a{font-size:16px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#q-now .d{font-size:18px;color:var(--fg)}
#q-bar{height:4px;background:#222;margin-top:3px}#q-bar i{display:block;height:100%;width:0;background:var(--green)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{display:block;width:3px;height:3px;background:var(--green);animation:eqb .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.3s}.eq i:nth-child(3){animation-delay:.6s}
@keyframes eqb{0%,100%{height:3px}50%{height:12px}}
#q-now.paused .eq i{animation-play-state:paused}
#q-now.paused{border-color:#444;background:transparent}
#q-now.paused .lab{color:var(--dim)}
#q-list{position:absolute;left:10px;right:10px;top:96px;bottom:6px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.qr{display:flex;align-items:center;gap:10px;padding:6px 10px;margin-bottom:6px;border:2px solid #262626;cursor:pointer}
.qr .n{font:700 12px 'Silkscreen',monospace;color:var(--green);min-width:22px}
.qr .qa{width:44px;height:44px;flex:none;background:#151515 center/cover;border:1px solid #333}
.qr .qa.noart{display:flex;align-items:center;justify-content:center}
.qr .qa.noart::after{content:'\266A';color:#444;font-size:22px}
.qr .m{flex:1;min-width:0}
.qr .t{font-size:22px;font-weight:bold;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr .a{font-size:17px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr .d{font-size:18px;color:var(--dim)}
.qr.arm{border-color:var(--yellow)}
.qr.arm .d{color:var(--yellow);font:700 11px 'Silkscreen',monospace}
.q-msg{padding:24px 10px;text-align:center;color:var(--dim);font-size:20px}
/* volume now lives on the music screen, inside the music card */
#m-vol{display:flex;align-items:center;gap:4px;width:100%;margin-top:4px}
#m-vol button{font-size:15px;padding:0;height:32px;min-width:32px}
#m-vol button[data-v="mute"]{min-width:52px;font-size:11px}
#vol-b{flex:1;height:26px;background:#222;position:relative;touch-action:none;cursor:pointer}
#vol-b i{display:block;height:100%;background:var(--pink);width:0;pointer-events:none}
#vol-n{font-size:20px;min-width:48px;text-align:center}
#c-apps{grid-column:1;grid-row:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-content:start}
#c-apps button{display:flex;gap:6px;align-items:center;font-size:13px;text-align:left;padding:5px}
#c-apps button span{background:var(--c);color:#000;padding:0 5px}
#c-sys{grid-column:1/3;grid-row:2;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#c-sys button{font-size:13px;height:100%;border-width:3px}
/* screen saver (burn-in protection) */
#saver{position:fixed;inset:0;background:#000;display:none;z-index:11}
#saver-t{position:absolute;font:700 72px 'VT323',monospace;color:#3a3a3a;letter-spacing:3px}
#app{transition:filter .3s}
#loc-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:flex-start;justify-content:center;z-index:9;padding:14px}
#loc-box{width:min(720px,100%);border:3px solid var(--cyan);padding:14px 12px;background:#050505}
#loc-title{font:700 12px 'Silkscreen',monospace;color:var(--cyan);margin-bottom:8px}
#loc-in{width:100%;font:24px 'VT323',monospace;background:#000;color:var(--fg);border:2px solid var(--fg);padding:8px;outline:none;user-select:text}
#loc-msg{font-size:18px;color:var(--yellow);min-height:22px;margin:6px 0}
#loc-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;max-height:calc(var(--sh,100vh)*.3);overflow:auto}
#loc-list button{text-align:left;padding:8px;font-size:12px}
#loc-btns{display:flex;gap:8px}#loc-btns button{flex:1;padding:8px}
#conn{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--red);color:#000;font:700 12px 'Silkscreen',monospace;padding:3px 10px;display:none;z-index:7}
#toast{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:var(--green);color:#000;font:700 12px 'Silkscreen',monospace;padding:4px 10px;display:none;z-index:9}

/* crop overlay */
#crop{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;gap:6px;padding:6px;z-index:8}
#cr-area{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#cr-wrap{position:relative;display:inline-block;overflow:hidden;line-height:0;border:2px solid #333}
#cr-img{display:block;max-width:100%;max-height:calc(var(--sh,100vh) - 70px);touch-action:none;pointer-events:auto}
#cr-sel{position:absolute;border:2px solid var(--yellow);box-shadow:0 0 0 9999px rgba(0,0,0,.6);display:none;pointer-events:none}
#cr-sel .hd{position:absolute;width:16px;height:16px;background:var(--yellow);border:2px solid #000;transform:translate(-50%,-50%)}
#cr-bar{display:flex;gap:8px;width:100%}
#cr-bar button{flex:1;padding:8px}
#cr-bar button:disabled{opacity:.3}
#cr-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--yellow);color:#000;font:700 11px 'Silkscreen',monospace;padding:2px 8px;pointer-events:none}

/* start overlay */
/* #stage holds everything. When the phone is in portrait it is rotated 90deg so the dashboard still reads as landscape. */
#stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#tabs #rf,#tabs #flip{flex:.8}
#tabs #flip{display:none}
</style>
</head>
<body>
<div id="stage">
<div id="crop">
  <div id="cr-area"><div id="cr-wrap"><img id="cr-img" alt=""><div id="cr-sel"></div></div></div>
  <div id="cr-hint">SERET UNTUK PILIH BAHAGIAN</div>
  <div id="cr-bar">
    <button class="gr" id="cr-save" disabled>SIMPAN CROP</button>
    <button class="cy" id="cr-full">SIMPAN PENUH</button>
    <button class="rd" id="cr-cancel">BATAL</button>
  </div>
</div>
<div id="loc-modal">
  <div id="loc-box">
    <div id="loc-title">TUKAR LOKASI</div>
    <input id="loc-in" type="text" placeholder="Nama bandar, cth: Kuantan" autocomplete="off" autocapitalize="words" enterkeyhint="search">
    <div id="loc-msg"></div>
    <div id="loc-list"></div>
    <div id="loc-btns">
      <button class="gr" id="loc-go">CARI</button>
      <button class="yl" id="loc-reset">AUTOMATIK</button>
      <button class="rd" id="loc-cancel">BATAL</button>
    </div>
  </div>
</div>
<div id="saver"><div id="saver-t">--:--</div></div>
<div id="conn"></div>
<div id="toast"></div>
<div id="app">
  <div id="screens">
    <section class="screen" id="s-music">
      <div class="panel" id="m-card"><span class="tag">MUSIC</span><span class="tag r" id="m-app">-</span>
        <div id="art"></div><div id="m-title">Tiada lagu</div><div id="m-artist">-</div>
        <div id="m-bar"></div><div id="m-time">0:00 / 0:00</div>
        <div id="m-vol"><button data-v="-5">-</button><div id="vol-b"><i></i></div><button data-v="5">+</button><span id="vol-n">-</span><button data-v="mute">MUTE</button></div>
        <div id="m-ctl"><button data-m="prev">|&lt;</button><button id="m-play" data-m="playpause">||</button><button data-m="next">&gt;|</button></div>
      </div>
      <div class="panel pk" id="lyrics"><span class="tag">LYRICS</span><span class="tag r" id="ly-st"></span><div id="ly-wrap"><div id="ly-list"></div></div><span id="ly-off"><button id="ly-m">-</button><span id="ly-v"></span><button id="ly-p">+</button></span></div>
      <div class="panel cy" id="viz"><canvas></canvas></div>
    </section>

    <section class="screen" id="s-queue">
      <div class="panel gr" id="q-panel"><span class="tag">UP NEXT</span><span class="tag r" id="q-st"></span>
        <div id="q-now"><div id="q-art"></div>
          <div class="m"><div class="lab"><span class="eq"><i></i><i></i><i></i></span><span id="q-lab">SEKARANG</span></div>
            <div class="t" id="q-t">-</div><div class="a" id="q-a">-</div><div id="q-bar"><i></i></div></div>
          <div class="d" id="q-time">0:00</div></div>
        <div id="q-list"><div class="q-msg">Memuatkan...</div></div>
      </div>
    </section>

    <section class="screen" id="s-home">
      <div class="panel pk" id="clock"><span class="tag">CLOCK</span><div id="clock-t">--:--</div><div id="clock-d">-</div><div id="clock-loc"></div><div id="pray-next"></div></div>
      <div class="panel gr" id="stats"><span class="tag">PC STATS</span>
        <div class="stat" style="--c:var(--cyan)"><div class="l">CPU</div><div class="v" id="st-cpu">-</div><div class="b"><i id="b-cpu"></i></div></div>
        <div class="stat" style="--c:var(--pink)"><div class="l">RAM</div><div class="v" id="st-ram">-</div><div class="b"><i id="b-ram"></i></div></div>
        <div class="stat" style="--c:var(--green)"><div class="l">TEMP</div><div class="v" id="st-temp">-</div><div class="b"><i id="b-temp"></i></div></div>
        <div class="stat" id="t-gpu" style="--c:var(--yellow)"><div class="l">GPU</div><div class="v" id="st-gpu">-</div><div class="b"><i id="b-gpu"></i></div></div>
        <div class="stat" style="--c:var(--orange)"><div class="l">DISK C:</div><div class="v" id="st-disk">-</div><div class="b"><i id="b-disk"></i></div></div>
        <div class="stat" style="--c:var(--green)"><div class="l">NET ↓</div><div class="v" id="st-down">-</div></div>
        <div class="stat" style="--c:var(--purple)"><div class="l">NET ↑</div><div class="v" id="st-up">-</div></div>
      </div>
      <div id="prayer"></div>
    </section>

    <section class="screen" id="s-ctrl">
      <div class="panel cy" id="c-apps"><span class="tag">APPS</span></div>
      <div class="panel or" id="c-sys"><span class="tag">SYSTEM</span>
        <button class="cy" data-s="shot">SHOT</button>
        <button class="gr" data-s="desktop">DESKTOP</button>
        <button class="yl" data-go="home">BIG CLOCK</button>
        <button class="rd" data-s="lock" data-hold="1">HOLD<br>LOCK</button>
        <button class="rd" data-s="sleep" data-hold="1">HOLD<br>SLEEP</button>
      </div>
    </section>
  </div>
  <nav id="tabs"><button data-go="music">MUSIC</button><button data-go="queue">QUEUE</button><button data-go="home">HOME</button><button data-go="ctrl">CONTROL</button><button id="dim" style="flex:.45">DIM 100</button><button id="rf">FULL / REFRESH</button><button id="flip">FLIP</button></nav>
</div>
</div>

<script>
let TOKEN = new URLSearchParams(location.search).get('t') || '';
try { if (TOKEN) localStorage.setItem('t', TOKEN); else TOKEN = localStorage.getItem('t') || ''; } catch (e) {}
const $ = s => document.querySelector(s);
const api = (path, body, method) => fetch(path, {method: method || (body ? 'POST' : 'GET'), headers: {'X-Token': TOKEN, 'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined}).then(r => r.json());
let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 1800); };
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const speed = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB/s' : Math.round(b / 1024) + ' KB/s';

// ---- tabs
function go(name) {
  document.querySelectorAll('.screen').forEach(e => e.classList.toggle('on', e.id === 's-' + name));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  try { localStorage.setItem('tab', name); } catch (e) {}
  if (name === 'music') { sizeCanvas(); setLyFont(); lyScroll(lyIdx); }   // the lyrics box had no size while this tab was hidden
}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
let sx = null, sy = null;
document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
document.addEventListener('touchend', e => {
  if (sx === null) return;
  const t = e.changedTouches[0], ddx = t.clientX - sx, ddy = t.clientY - sy; sx = null;
  // "left/right" in the page's own orientation: when rotated, that is the screen's vertical axis.
  const dx = rotMode === 'cw' ? ddy : rotMode === 'ccw' ? -ddy : ddx;
  if (Math.abs(dx) < 90 || (typeof cropOpen === 'function' && cropOpen())) return;
  const order = ['music', 'queue', 'home', 'ctrl']; const cur = order.findIndex(n => $('#s-' + n).classList.contains('on'));
  go(order[Math.max(0, Math.min(order.length - 1, cur + (dx < 0 ? 1 : -1)))]);
});

// ---- layout: always look landscape, even if the phone is stuck in portrait (e.g. after the screen turned off)
let rotMode = null;   // null = real landscape, 'cw' / 'ccw' = portrait phone, page rotated
function layoutStage() {
  const st = $('#stage'), W = innerWidth, H = innerHeight, portrait = H > W;
  document.documentElement.style.setProperty('--sh', (portrait ? W : H) + 'px');  // usable "height" in the page's own orientation
  if (!portrait) { rotMode = null; st.style.cssText = ''; $('#flip').style.display = 'none'; }
  else {
    let dir = 'cw'; try { dir = localStorage.getItem('rot') || 'cw'; } catch (e) {}
    rotMode = dir;
    st.style.width = H + 'px'; st.style.height = W + 'px'; st.style.transformOrigin = '0 0';
    st.style.transform = dir === 'cw' ? `translateX(${W}px) rotate(90deg)` : `translateY(${H}px) rotate(-90deg)`;
    $('#flip').style.display = 'block';
  }
  setTimeout(() => { if (typeof sizeCanvas === 'function') sizeCanvas(); if (typeof lyScroll === 'function') { setLyFont(); lyScroll(lyIdx); } }, 60);
}
// Debounced: while Android is rotating the screen the size changes several times; wait until it settles (less twitchy).
let layT = null; const layoutSoon = () => { clearTimeout(layT); layT = setTimeout(layoutStage, 300); };
addEventListener('resize', layoutSoon);
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', layoutSoon);
document.addEventListener('fullscreenchange', layoutSoon);
$('#flip').onclick = () => { try { localStorage.setItem('rot', rotMode === 'cw' ? 'ccw' : 'cw'); } catch (e) {} layoutStage(); };
layoutStage();

// ---- fullscreen (optional, one tap) / wake lock (only works on HTTPS or localhost)
let wl = null;
async function keepAwake() { try { wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
// Browsers only allow fullscreen after a touch, and drop it whenever the screen turns off.
// So: the first touch anywhere on the page goes fullscreen and locks to landscape. 'landscape' (not
// 'landscape-primary') lets Android flip between the two landscape directions by itself, never to portrait.
async function goFull() {
  if (document.fullscreenElement) return;

    if (rotMode === 'cw') f = (e.clientY - r.top) / r.height;            // page rotated: the bar's left->right runs down the screen
    else if (rotMode === 'ccw') f = (r.bottom - e.clientY) / r.height;
    else f = (e.clientX - r.left) / r.width;
    return Math.max(0, Math.min(1, f));
  };
  const push = (pct, force) => {
    onVol({level: pct, muted: false});                                    // update the bar at once
    const now = Date.now(); volHold = now + 1500;
    if (force || now - lastSend > 90) { lastSend = now; pending = null; api('/api/volume', {set: pct}); } else pending = pct;   // don't flood the PC
  };
  bar.addEventListener('pointerdown', e => { down = true; bar.setPointerCapture(e.pointerId); push(Math.round(frac(e) * 100)); });
  bar.addEventListener('pointermove', e => { if (down) push(Math.round(frac(e) * 100)); });
  const end = e => { if (!down) return; down = false; push(Math.round(frac(e) * 100), true); };
  bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', () => { down = false; });
})();
document.querySelectorAll('[data-s]').forEach(b => {
  const run = async () => {
    const r = await api('/api/system/' + b.dataset.s, {});
    if (b.dataset.s === 'shot' && r.ok) return openCrop();
    toast(r.ok ? 'OK' : 'Gagal: ' + (r.error || '').slice(0, 40));
  };
  if (!b.dataset.hold) { b.onclick = run; return; }
  let t; const start = () => { b.classList.add('hold'); t = setTimeout(() => { b.classList.remove('hold'); run(); }, 800); };
  const stop = () => { b.classList.remove('hold'); clearTimeout(t); };
  b.addEventListener('touchstart', start, {passive: true}); b.addEventListener('touchend', stop); b.addEventListener('touchcancel', stop);
  b.addEventListener('mousedown', start); b.addEventListener('mouseup', stop); b.addEventListener('mouseleave', stop);
});
// ---- screenshot crop
const crop = $('#crop'), crImg = $('#cr-img'), crSel = $('#cr-sel');
let sel = null;
const cropOpen = () => crop.style.display === 'flex';
function openCrop() {
  sel = null; drawSel(); $('#cr-hint').textContent = 'SERET UNTUK PILIH BAHAGIAN';
  crImg.src = '/shot.jpg?t=' + encodeURIComponent(TOKEN) + '&n=' + Date.now();
  crop.style.display = 'flex';
}
function closeCrop() { crop.style.display = 'none'; crImg.removeAttribute('src'); sel = null; drag = null; }
function drawSel() {
  $('#cr-save').disabled = !sel;
  if (!sel) { crSel.style.display = 'none'; return; }
  Object.assign(crSel.style, {display: 'block', left: sel.x * 100 + '%', top: sel.y * 100 + '%', width: sel.w * 100 + '%', height: sel.h * 100 + '%'});
}
// Pointer position in the crop image's own pixel space, whatever the page rotation.
// (Browsers' offsetX/Y are not reliable under a rotated ancestor, so undo the rotation by hand.)
function toLocal(e) {
  const W = innerWidth, H = innerHeight;
  let x = e.clientX, y = e.clientY;                              // screen -> stage coordinates
  if (rotMode === 'cw') { x = e.clientY; y = W - e.clientX; }
  else if (rotMode === 'ccw') { x = H - e.clientY; y = e.clientX; }
  const w = $('#cr-wrap');                                        // stage -> image (layout offsets ignore transforms)
  return {x: x - (w.offsetLeft + w.clientLeft + crImg.offsetLeft), y: y - (w.offsetTop + w.clientTop + crImg.offsetTop)};
}
const rel = e => { const p = toLocal(e); return {x: Math.min(1, Math.max(0, p.x / crImg.clientWidth)), y: Math.min(1, Math.max(0, p.y / crImg.clientHeight))}; };
// Resize handles (visual only; hit-testing below is done in pixels for easy touch).
['tl:0:0', 't:50:0', 'tr:100:0', 'l:0:50', 'r:100:50', 'bl:0:100', 'b:50:100', 'br:100:100'].forEach(s => {
  const [, x, y] = s.split(':'); const d = document.createElement('i'); d.className = 'hd';
  d.style.left = x + '%'; d.style.top = y + '%'; crSel.appendChild(d);
});
const MINF = 0.02, TOL = 30, clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let drag = null;
function hitTest(e) {
  if (!sel) return {m: 'new'};
  const cw = crImg.clientWidth, ch = crImg.clientHeight;
  const L = sel.x * cw, T = sel.y * ch, R = L + sel.w * cw, B = T + sel.h * ch;
  const {x, y} = toLocal(e);
  const inX = x > L - TOL && x < R + TOL, inY = y > T - TOL && y < B + TOL;
  let l = Math.abs(x - L) < TOL && inY, rt = Math.abs(x - R) < TOL && inY;
  let t = Math.abs(y - T) < TOL && inX, b = Math.abs(y - B) < TOL && inX;
  if (l && rt) { if (Math.abs(x - L) <= Math.abs(x - R)) rt = false; else l = false; }
  if (t && b) { if (Math.abs(y - T) <= Math.abs(y - B)) b = false; else t = false; }
  if (l || rt || t || b) return {m: 'resize', l, r: rt, t, b};
  if (x > L && x < R && y > T && y < B) return {m: 'move'};
  return {m: 'new'};
}
crImg.addEventListener('pointerdown', e => {
  crImg.setPointerCapture(e.pointerId);
  const h = hitTest(e), p = rel(e);
  drag = {...h, start: p, orig: sel ? {...sel} : null};
  if (h.m === 'new') { sel = null; drawSel(); }
});
crImg.addEventListener('pointermove', e => {
  if (!drag) return; const p = rel(e), o = drag.orig;
  if (drag.m === 'new') {
    const s = drag.start;
    sel = {x: Math.min(s.x, p.x), y: Math.min(s.y, p.y), w: Math.abs(p.x - s.x), h: Math.abs(p.y - s.y)};
    if (sel.w < 0.01 || sel.h < 0.01) sel = null;
  } else if (drag.m === 'move') {
    sel = {x: clamp(o.x + p.x - drag.start.x, 0, 1 - o.w), y: clamp(o.y + p.y - drag.start.y, 0, 1 - o.h), w: o.w, h: o.h};
  } else {
    let x0 = o.x, x1 = o.x + o.w, y0 = o.y, y1 = o.y + o.h;
    if (drag.l) x0 = clamp(p.x, 0, x1 - MINF);
    if (drag.r) x1 = clamp(p.x, x0 + MINF, 1);
    if (drag.t) y0 = clamp(p.y, 0, y1 - MINF);
    if (drag.b) y1 = clamp(p.y, y0 + MINF, 1);
    sel = {x: x0, y: y0, w: x1 - x0, h: y1 - y0};
  }
  drawSel();
});
const endDrag = () => { drag = null; if (sel) $('#cr-hint').textContent = 'SERET DALAM = GERAK · TARIK TEPI = UBAH SAIZ'; };
crImg.addEventListener('pointerup', endDrag);
crImg.addEventListener('pointercancel', endDrag);
crImg.addEventListener('dragstart', e => e.preventDefault());
async function saveShot(rect) {
  const r = await api('/api/shot/save', rect || {});
  if (r.ok) { closeCrop(); toast('Disimpan: ' + r.result.split('\\').pop()); } else toast('Gagal: ' + (r.error || '').slice(0, 40));
}
$('#cr-save').onclick = () => sel && saveShot(sel);
$('#cr-full').onclick = () => saveShot(null);
$('#cr-cancel').onclick = async () => { await api('/api/shot/cancel', {}); closeCrop(); toast('Dibatalkan'); };

// ---- up next: the list comes from Apple Music's Queue panel (read by the PC). Tap a song once to mark it,
// tap it again to jump to it (the PC presses "next" that many times; the songs in between are skipped).
const Q_MSG = {
  closed: 'Panel Queue dalam Apple Music tertutup. Buka panel Queue (butang Queue) supaya senarai muncul.',
  no_app: 'Apple Music tak berjalan.',
  other_app: 'Senarai ini hanya untuk Apple Music dan YouTube Music (dalam Edge). Pemain semasa ialah yang lain.',
  ytm_closed: 'Buka halaman Now Playing YouTube Music dan pilih tab UP NEXT (tab YouTube Music mesti yang sedang dipaparkan dalam Edge).',
  ytm_noaccess: 'Edge tak mendedahkan kandungan halaman. Hidupkan Web accessibility di edge://accessibility, kemudian muat semula tab YouTube Music (F5).',
  error: 'Tak dapat membaca senarai Apple Music (susun atur aplikasi mungkin berubah).',
  init: 'Memuatkan...'
};
let qItems = [], qArm = null, qArmT = null;
function setQArt(el, url) {                        // album picture on a queue row (or a note placeholder)
  const ok = typeof url === 'string' && /^https:\/\//.test(url);
  el.classList.toggle('noart', !ok);
  el.style.backgroundImage = ok ? 'url("' + encodeURI(url) + '")' : 'none';
}
function onQueue(q) {
  const items = q.items || [];
  const list = $('#q-list');
  // Same songs in the same order and the rows are already drawn (e.g. only album pictures arrived late):
  // update the pictures in place, so a song you just tapped stays marked.
  if (q.state === 'ok' && items.length && items.length === qItems.length && list.querySelectorAll('.qr').length === items.length
      && items.every((it, k) => it.title === qItems[k].title && it.artist === qItems[k].artist)) {
    qItems = items; list.querySelectorAll('.qr').forEach((r, k) => setQArt(r.querySelector('.qa'), items[k].art)); return;
  }
  qArm = null; clearTimeout(qArmT);
  qItems = items;
  list.innerHTML = '';
  $('#q-st').textContent = q.state === 'ok' ? qItems.length + ' LAGU' : '';
  if (q.state !== 'ok' || !qItems.length) {
    const d = document.createElement('div'); d.className = 'q-msg'; d.textContent = q.state === 'ok' ? 'Senarai kosong.' : (Q_MSG[q.state] || Q_MSG.error);
    list.appendChild(d); return;
  }
  qItems.forEach((it, i) => {
    const r = document.createElement('div'); r.className = 'qr'; r.dataset.i = i;
    r.innerHTML = '<span class="n"></span><span class="qa"></span><span class="m"><div class="t"></div><div class="a"></div></span><span class="d"></span>';
    r.querySelector('.n').textContent = i + 1; r.querySelector('.t').textContent = it.title; setQArt(r.querySelector('.qa'), it.art);
    r.querySelector('.a').textContent = it.artist + (it.album ? ' · ' + it.album : ''); r.querySelector('.d').textContent = it.dur || '';
    list.appendChild(r);
  });
}
(() => {
  const list = $('#q-list'); let down = null;
  list.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY}; });
  list.addEventListener('pointerup', e => {
    const d = down; down = null;
    if (!d || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 10) return;       // it was a scroll, not a tap
    const row = e.target.closest('.qr'); if (!row) return;
    const i = +row.dataset.i, it = qItems[i];
    if (qArm === i) {                                                           // second tap on the same song: go
      qArm = null; clearTimeout(qArmT); row.classList.remove('arm'); row.querySelector('.d').textContent = it.dur || '';
      api('/api/queue/jump', {n: i + 1, title: it.title}); toast('Melompat: ' + it.title); return;   // YouTube Music plays it by title, Apple Music skips n songs
    }
    list.querySelectorAll('.qr.arm').forEach(x => { x.classList.remove('arm'); x.querySelector('.d').textContent = qItems[+x.dataset.i].dur || ''; });
    qArm = i; row.classList.add('arm'); row.querySelector('.d').textContent = 'TAP LAGI';
    clearTimeout(qArmT); qArmT = setTimeout(() => { qArm = null; row.classList.remove('arm'); row.querySelector('.d').textContent = it.dur || ''; }, 4000);
  });
})();

const COLORS = ['var(--pink)', 'var(--green)', 'var(--yellow)', 'var(--cyan)', 'var(--orange)', 'var(--purple)'];
async function buildApps() {
  cfg = await api('/api/config');
  const box = $('#c-apps'); box.querySelectorAll('button').forEach(b => b.remove());   // keep the tag, rebuild the buttons
  cfg.apps.forEach((a, i) => {
    const b = document.createElement('button'); b.style.setProperty('--c', COLORS[i % COLORS.length]);
    b.innerHTML = `<span>${a.key}</span>${a.name}`; b.onclick = () => { api('/api/launch', {i}); toast(a.name); };
    box.appendChild(b);
  });
}
(async () => {
  await buildApps();
  loadPrayer(); setInterval(loadPrayer, 3600000);
})();

// ---- REFRESH without reloading the page. A real reload throws away fullscreen, so instead we re-do the work in place:
// new socket, app buttons, lyrics, prayer times, layout. Only if a NEW VERSION of the page has been installed on the PC
// do we do a real reload (once), because that is the only way to pick up new code.
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };
async function fetchHash() { try { return hashStr(await (await fetch('/', {cache: 'no-store'})).text()); } catch (e) { return null; } }
let pageHash = null; fetchHash().then(h => { pageHash = h; });
let refreshing = false;
async function softRefresh() {
  if (refreshing) return; refreshing = true;
  try {
    toast('Menyegarkan...');
    const h = await fetchHash();
    if (h !== null && pageHash !== null && h !== pageHash) { toast('Versi baru, memuat semula'); setTimeout(() => location.reload(), 500); return; }
    try { await buildApps(); } catch (e) {}
    lyKey = ''; lyrics = null;                    // the next media update re-downloads the lyrics and reloads this song's offset
    loadPrayer();
    layoutStage();
    dropAndReconnect();                           // brand new socket, never a stale one
    toast('Dimuat semula');
  } finally { refreshing = false; }
}
let startTab = 'music'; try { startTab = localStorage.getItem('tab') || 'music'; } catch (e) {}
go(startTab);
renderLyrics(0);

// ---- burn-in protection: dim levels, pixel shift, and a dark screen saver when idle
const SAVER_MIN = 5;                       // minutes with no music + no touch before the saver starts
const DIMS = [1, 0.7, 0.45];
let dimI = 0; try { dimI = Math.min(DIMS.length - 1, +localStorage.getItem('dim') || 0); } catch (e) {}
function applyDim() { $('#app').style.filter = `brightness(${DIMS[dimI]})`; $('#dim').textContent = 'DIM ' + Math.round(DIMS[dimI] * 100); }
$('#dim').onclick = () => { dimI = (dimI + 1) % DIMS.length; try { localStorage.setItem('dim', dimI); } catch (e) {} applyDim(); };
applyDim();

let lastTouch = Date.now(), saverOn = false;
['pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => { if (!saverOn) lastTouch = Date.now(); }, {passive: true, capture: true}));
function placeSaver() {
  const d = new Date(), t = $('#saver-t');
  t.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  t.style.left = (8 + Math.random() * 55) + '%'; t.style.top = (8 + Math.random() * 65) + '%';
}
function showSaver() { saverOn = true; $('#saver').style.display = 'block'; placeSaver(); }
function hideSaver() { saverOn = false; lastTouch = Date.now(); $('#saver').style.display = 'none'; }
// Tapping the saver only wakes the screen; stopPropagation so the tap doesn't press a button underneath.
$('#saver').addEventListener('click', e => { e.stopPropagation(); hideSaver(); });
let saverMoved = 0;
setInterval(() => {
  const playing = !!(media && media.playing);
  const busy = cropOpen() || locModal.style.display === 'flex';
  if (saverOn && playing) hideSaver();
  else if (!saverOn && !playing && !busy && Date.now() - lastTouch > SAVER_MIN * 60000) showSaver();
  if (Date.now() - saverMoved > 60000) {            // every minute: move the saver clock and nudge the UI a few px
    saverMoved = Date.now();
    if (saverOn) placeSaver();
    $('#app').style.transform = `translate(${Math.round(Math.random() * 8 - 4)}px, ${Math.round(Math.random() * 8 - 4)}px)`;
  }
}, 1000);
</script>
